name: Deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list = show remote files, dry-run = show what would upload, deploy = upload"
        type: choice
        options: [list, dry-run, deploy]
        default: list

jobs:
  list:
    if: inputs.mode == 'list'
    runs-on: ubuntu-latest
    steps:
      - name: List remote directory
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_LOGIN: ${{ secrets.FTP_LOGIN }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || './' }}
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          lftp -u "$FTP_LOGIN,$FTP_PASSWORD" "$FTP_SERVER" -e "set ftp:ssl-allow yes; cd $FTP_SERVER_DIR; ls -la; ls -la public; ls -la bootstrap/cache; bye"

  deploy:
    if: inputs.mode != 'list'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_LOGIN }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          dry-run: ${{ inputs.mode == 'dry-run' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            .env
            .env.*
            **/.htaccess
            storage/**
            public/storage/**
            bootstrap/cache/config.php
            tests/**
            docker/**
            install/**
            docker-compose.yml
            phpunit.xml
